<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Work - Yajath Kandregula</title>
  <link rel="icon" href="/static/images/logo.jpg" type="image/jpg" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
</head>
<body>

<header>
  <div class="logo">▲▼</div>
  <nav>
    <span id="menuToggle">Menu</span>
    <a href="mailto:yajathkandregula@example.com" style="color: inherit; text-decoration: none;">Hire Me</a>
    <div class="dropdown-menu" id="dropdownMenu">
      <a href="{{url_for('self_app.index')}}" class="dropdown-link">Home</a>
      <a href="{{url_for('self_app.creator')}}" class="dropdown-link">Creator</a>
    </div>
  </nav>
</header>

<div class="auth-container">
  <h2 class="auth-title">✏️ Edit Work</h2>
  <p class="auth-subtitle">Modify work details below</p>

  <form method="POST" enctype="multipart/form-data">
    <input type="text" name="work_name" class="neon-input" value="{{ work.work_name }}" required />

    <textarea name="description" class="neon-input" rows="4" required>{{ work.work_description }}</textarea>

    <select name="work_type" class="neon-input" required>
      <option value="Full Time" {% if work.work_type=="Full Time" %}selected{% endif %}>Full Time</option>
      <option value="Internship" {% if work.work_type=="Internship" %}selected{% endif %}>Internship</option>
    </select>

    <input type="file" name="certificate" class="neon-input" accept=".pdf,.jpg,.png" />

    <input type="url" name="drive_link" class="neon-input" value="{{ work.drive_link }}" required />

    <button type="submit" class="neon-button">Update Work</button>
  </form>
</div>
</body>
</html>
